<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mengo-Hub | Subject Detail</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="dashboard">
        <header class="dashboard-header">
            <div class="header-left">
                <div class="logo-circle small">S</div>
                <div>
                    <h1 id="subjectTitle">Subject Details</h1>
                    <p id="subjectSubtitle"></p>
                </div>
            </div>
            <div class="header-right">
                <button class="btn btn-text" onclick="window.location.href='dashboard.html'">Back</button>
            </div>
        </header>

        <main class="main-content">
            <div class="view-header">
                <h2>Topic Summary</h2>
            </div>
            <div style="display: grid; grid-template-columns: 1fr 3fr; gap: 24px;">
                <div class="card" id="subjectTopics"></div>
                <div class="card" id="subjectResources"></div>
            </div>
        </main>
    </div>

    <script src="subject-detail.js"></script>
</body>
</html>
